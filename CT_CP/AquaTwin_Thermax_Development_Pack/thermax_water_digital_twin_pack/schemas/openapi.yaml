openapi: 3.1.0
info:
  title: AquaTwin Operations API
  version: 1.0.0
  description: Starter API contract for a water-treatment operations ERP and digital twin.
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /plants:
    get:
      summary: List plants available to the authenticated user
      responses:
        "200":
          description: Plant list
  /plants/{plantId}/overview:
    get:
      summary: Get plant overview KPIs
      parameters:
        - in: path
          name: plantId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plant overview
  /plants/{plantId}/assets:
    get:
      summary: List plant assets
      parameters:
        - in: path
          name: plantId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset list
  /plants/{plantId}/telemetry:
    get:
      summary: Query telemetry by tag and time range
      parameters:
        - in: path
          name: plantId
          required: true
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Telemetry series
  /plants/{plantId}/commands:
    post:
      summary: Request an authorised command (simulation only in MVP)
      parameters:
        - in: path
          name: plantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetTag, action, mode, idempotencyKey]
              properties:
                assetTag: { type: string }
                action: { type: string, enum: [start, stop] }
                mode: { type: string, enum: [simulation] }
                reason: { type: string }
                idempotencyKey: { type: string }
      responses:
        "202":
          description: Command request accepted for validation; equipment action is not yet confirmed
        "403":
          description: User is not authorised
        "409":
          description: Interlock, mode or state conflict
  /alarms/{alarmId}/acknowledge:
    post:
      summary: Acknowledge an alarm without clearing its process condition
      parameters:
        - in: path
          name: alarmId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alarm acknowledgement recorded
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
